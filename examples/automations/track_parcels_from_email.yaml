# Extract Burd's Min levering link from incoming e-mail and register it
# with `burd.track_parcel`, so parcels start tracking — delivery evening
# included — the moment Burd's mail lands in your inbox.
#
# Requirements:
#   - one or more core IMAP config entries with "text" enabled under
#     "message data" and the max message size raised (carrier mails are
#     long) — full setup guide and pitfalls: track_parcels_from_email.md
#   - optional: an `ai_task` entity for the AI fallback branch; delete
#     the whole `else:` block if you don't use one
#   - PRIVACY: by default this fires on EVERY incoming mail and (with the
#     AI branch) can send mail bodies to your AI Task. Scope the IMAP
#     search to the carrier's sender first — see "Scope & privacy" in the .md.
#
# The regex is deliberately written without backslashes (`(?<![0-9A-Za-z])`
# instead of `\b`, `[0-9]` instead of `\d`): Jinja treats `\b` inside a
# string literal as a backspace escape, so the pattern would silently
# never match.

alias: "Burd: track from e-mail"
description: >-
  Listens to imap_content events from all IMAP entries. Fast regex path for
  Burd links and shipment numbers; optional AI fallback for mails whose layout the
  regex does not recognise.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: imap_content

variables:
  sender: "{{ trigger.event.data.sender | default('') | lower }}"
  subject: "{{ trigger.event.data.subject | default('') }}"
  body: "{{ trigger.event.data.text | default('') }}"
  content: "{{ subject ~ ' ' ~ body }}"
  # Burd's own mail links to the Min levering page, which also carries the
  # planned delivery evening; prefer it. The 18-digit shipment number is
  # only matched in mail from Burd itself, since webshop mails are full of
  # other long numbers.
  burd_links: >-
    {{ content | regex_findall('https://k[.]burd[.]dk/(?:f/)?[0-9A-Za-z_-]+')
       | unique | list }}
  burd_numbers: >-
    {{ (content | regex_findall('(?<![0-9])[0-9]{18}(?![0-9])') | unique | list)
       if 'burd' in sender and not burd_links else [] }}
  burd_codes: "{{ burd_links + burd_numbers }}"
  # Keyword gate for the AI fallback — localise to your language(s).
  is_parcel_mail: >-
    {{ content | lower is search('package|shipped|out for delivery|track|shipment|delivery') }}

conditions:
  # initial=true means "new message"; false means a duplicate trigger of
  # the SAME message (e.g. after a reconnect) — requiring it is free dedup.
  - condition: template
    value_template: "{{ trigger.event.data.initial | default(true) }}"
  - condition: template
    value_template: "{{ is_parcel_mail or burd_codes | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ burd_codes }}"
      sequence:
        - action: burd.track_parcel
          data:
            tracking_code: "{{ repeat.item }}"
  - if:
      - condition: template
        value_template: "{{ burd_codes | count > 0 }}"
    then:
      - action: notify.mobile_app_your_phone
        data:
          title: "📦 Burd parcel picked up from mail"
          message: >-
            {{ burd_codes | join(', ') }} (mail from {{ sender }})
    else:
      # ---- Optional AI fallback — delete this block if you have no ai_task entity ----
      - action: ai_task.generate_data
        data:
          task_name: burd-tracking-code-extraction
          entity_id: ai_task.your_ai_task_entity
          instructions: >-
            Below is an e-mail. Determine whether it is about a Burd
            delivery and contains its Min levering link
            (https://k.burd.dk/f/...) or its 18-digit shipment number.
            Prefer the link. Never return an order, customer or invoice
            number. If the mail is from a different carrier, answer
            'other'. When in doubt: 'none'.

            Sender: {{ sender }}
            Subject: {{ subject }}
            Body:
            {{ body[:6000] }}
          structure:
            carrier:
              description: Whether a Burd link or shipment number was found
              required: true
              selector:
                select:
                  options: ["burd", "other", "none"]
            tracking_code:
              description: The Min levering link or shipment number, or empty if none
              required: false
              selector:
                text:
        response_variable: ai_result
      - choose:
          - conditions: "{{ ai_result.data.carrier == 'burd' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: burd.track_parcel
                data:
                  tracking_code: "{{ ai_result.data.tracking_code | trim }}"
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Burd parcel picked up from mail (AI)"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }})"
          - conditions: "{{ ai_result.data.carrier == 'other' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Tracking number found – not a Burd parcel"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }}, subject: {{ subject }})"
